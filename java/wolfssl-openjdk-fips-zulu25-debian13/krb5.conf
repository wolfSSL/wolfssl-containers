#
# FIPS 140-3 Kerberos configuration
#
# Kerberos uses only the AES encryption types, built on wolfCrypt FIPS
# (Certificate #5548) AES and HMAC. The RFC 8009 SHA-2 types are preferred,
# with the SHA-1 types as fallback for KDCs that do not support them. DES,
# 3DES and RC4 are not in the wolfCrypt FIPS boundary.
#

[libdefaults]
    # AES only, for tickets and keys
    default_tkt_enctypes = aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128 aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tgs_enctypes = aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128 aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128 aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

    # No fallback to DES, 3DES or RC4
    allow_weak_crypto = false

    # Default realm (applications can override it)
    # default_realm = EXAMPLE.COM

[realms]
    # KDC realms go here, or in an application's own krb5.conf

[domain_realm]
    # Domain to realm mappings go here, or in an application's own krb5.conf
